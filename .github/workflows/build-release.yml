name: Build & Release

on:
  push:
    branches: [main, develop]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing v* tag to build and publish through CI'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  RUST_BACKTRACE: 1
  TAURI_CLI_VERSION: "2"
  DEBIAN_FRONTEND: noninteractive
  TZ: Etc/UTC
  APT_LISTCHANGES_FRONTEND: none
  NEEDRESTART_MODE: a

defaults:
  run:
    shell: bash

jobs:
  # ─── Lint & Test ─────────────────────────────────────────────
  lint-test:
    name: Lint & Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install Tauri system deps (Linux)
        run: |
          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND="${DEBIAN_FRONTEND}" TZ="${TZ}" \
            APT_LISTCHANGES_FRONTEND="${APT_LISTCHANGES_FRONTEND}" \
            NEEDRESTART_MODE="${NEEDRESTART_MODE}" \
            apt-get -y -qq --no-install-recommends \
            -o Dpkg::Options::=--force-confdef \
            -o Dpkg::Options::=--force-confold \
            install \
            wget file libxdo-dev \
            libwebkit2gtk-4.1-dev librsvg2-dev \
            patchelf libssl-dev libgtk-3-dev libayatana-appindicator3-dev \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all -- -D warnings

      - name: Run tests
        run: cargo test -p s4drive-core --lib

  # ─── Linux build ─────────────────────────────────────────────
  build-linux:
    name: Linux (deb + rpm + AppImage)
    runs-on: ubuntu-latest
    needs: [lint-test]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

      - name: Build in Docker (Ubuntu 22.04 for Tauri v2 GLIBC compat)
        run: |
          docker run --rm --pull=missing \
            -v $PWD:/workspace \
            -e CARGO_HOME=/workspace/.cargo-docker \
            -e DEBIAN_FRONTEND="${DEBIAN_FRONTEND}" \
            -e TZ="${TZ}" \
            -e APT_LISTCHANGES_FRONTEND="${APT_LISTCHANGES_FRONTEND}" \
            -e NEEDRESTART_MODE="${NEEDRESTART_MODE}" \
            -e TAURI_CLI_VERSION="${TAURI_CLI_VERSION}" \
            -e HOST_UID="$(id -u)" \
            -e HOST_GID="$(id -g)" \
            ubuntu:22.04 \
            bash /workspace/scripts/build-linux-docker.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: s4drive-linux
          path: dist/linux/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  # ─── Windows build ───────────────────────────────────────────
  build-windows:
    name: Windows (exe + msi)
    runs-on: windows-latest
    needs: [lint-test]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install WiX Toolset (for MSI)
        run: |
          dotnet tool install --global wix
          echo "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Append
        shell: pwsh

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^${{ env.TAURI_CLI_VERSION }}"

      - name: Build MSI installer
        run: |
          cd src-tauri
          cargo tauri build --bundles msi --ci
        shell: bash

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: s4drive-windows
          path: |
            target/release/bundle/
            src-tauri/target/release/bundle/
          retention-days: 14
          compression-level: 0

  # ─── macOS build ─────────────────────────────────────────────
  build-macos:
    name: macOS (universal dmg)
    runs-on: macos-latest
    needs: [lint-test]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin, aarch64-apple-darwin

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^${{ env.TAURI_CLI_VERSION }}"

      - name: Generate .icns icon (macOS)
        run: |
          mkdir -p src-tauri/icons/s4drive.iconset
          cp src-tauri/icons/128x128.png src-tauri/icons/s4drive.iconset/icon_128x128.png
          cp src-tauri/icons/128x128@2x.png src-tauri/icons/s4drive.iconset/icon_256x256.png
          if command -v sips &>/dev/null; then
            sips -z 16 16 src-tauri/icons/128x128.png \
              --out src-tauri/icons/s4drive.iconset/icon_16x16.png
            sips -z 32 32 src-tauri/icons/128x128.png \
              --out src-tauri/icons/s4drive.iconset/icon_32x32.png
            sips -z 48 48 src-tauri/icons/128x128.png \
              --out src-tauri/icons/s4drive.iconset/icon_48x48.png
            sips -z 64 64 src-tauri/icons/128x128.png \
              --out src-tauri/icons/s4drive.iconset/icon_64x64.png
            iconutil -c icns src-tauri/icons/s4drive.iconset \
              -o src-tauri/icons/icon.icns
            echo "icon.icns created"
          else
            echo "sips not available"
          fi

      - name: Add .icns to tauri.conf.json (if generated)
        run: |
          if [ -f src-tauri/icons/icon.icns ]; then
            jq '.bundle.icon = ["icons/icon.icns"] + .bundle.icon' \
              src-tauri/tauri.conf.json > /tmp/tauri.conf.tmp \
              && mv /tmp/tauri.conf.tmp src-tauri/tauri.conf.json
            echo "Added icon.icns to config"
          fi

      - name: Build for x86_64
        run: |
          cd src-tauri
          cargo tauri build --target x86_64-apple-darwin --bundles dmg --ci
        env:
          CARGO_BUILD_TARGET: x86_64-apple-darwin

      - name: Build for arm64
        run: |
          cd src-tauri
          cargo tauri build --target aarch64-apple-darwin --bundles dmg --ci
        env:
          CARGO_BUILD_TARGET: aarch64-apple-darwin

      - name: Create universal binary with lipo
        run: |
          X86="target/x86_64-apple-darwin/release/s4drive"
          ARM="target/aarch64-apple-darwin/release/s4drive"
          UNIVERSAL="target/release/s4drive-universal"
          test -x "$X86"
          test -x "$ARM"
          mkdir -p target/release
          lipo -create -output "$UNIVERSAL" "$X86" "$ARM"
          lipo -info "$UNIVERSAL"

      - name: Build universal .app bundle
        run: |
          APP="target/release/S4Drive.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp target/release/s4drive-universal "$APP/Contents/MacOS/s4drive"
          cp src-tauri/icons/icon.svg "$APP/Contents/Resources/"
          cp src-tauri/icons/128x128.png "$APP/Contents/Resources/"
          # Write Info.plist without heredoc to avoid YAML parser confusion
          printf '%s\n' \
            '<?xml version="1.0" encoding="UTF-8"?>' \
            '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
            '<plist version="1.0">' \
            '<dict>' \
            '<key>CFBundleExecutable</key><string>s4drive</string>' \
            '<key>CFBundleIdentifier</key><string>com.s4drive.app</string>' \
            '<key>CFBundleName</key><string>S4Drive</string>' \
            '<key>CFBundleVersion</key><string>0.1.0</string>' \
            '<key>CFBundleShortVersionString</key><string>0.1.0</string>' \
            '<key>CFBundlePackageType</key><string>APPL</string>' \
            '<key>LSMinimumSystemVersion</key><string>10.15</string>' \
            '<key>NSHighResolutionCapable</key><true/>' \
            '</dict>' \
            '</plist>' \
            > "$APP/Contents/Info.plist"

      - name: Create universal DMG
        run: |
          DMG="target/release/S4Drive-0.1.0-universal.dmg"
          APP="target/release/S4Drive.app"
          hdiutil create -volname "S4Drive" -srcfolder "$APP" -ov -format UDZO "$DMG"
          ls -lh "$DMG"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: s4drive-macos
          path: target/release/*.dmg
          if-no-files-found: error

  # ─── CLI binary ──────────────────────────────────────────────
  build-cli:
    name: CLI (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            suffix: ""
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            suffix: ".exe"
          - target: x86_64-apple-darwin
            os: macos-latest
            suffix: ""
          - target: aarch64-apple-darwin
            os: macos-latest
            suffix: ""
    runs-on: ${{ matrix.os }}
    needs: [lint-test]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND="${DEBIAN_FRONTEND}" TZ="${TZ}" \
            APT_LISTCHANGES_FRONTEND="${APT_LISTCHANGES_FRONTEND}" \
            NEEDRESTART_MODE="${NEEDRESTART_MODE}" \
            apt-get -y -qq --no-install-recommends \
            -o Dpkg::Options::=--force-confdef \
            -o Dpkg::Options::=--force-confold \
            install \
            libssl-dev pkg-config

      - name: Build CLI binary
        run: cargo build --package s4drive-cli --target ${{ matrix.target }} --release

      - name: Upload CLI binary
        uses: actions/upload-artifact@v4
        with:
          name: s4drive-cli-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/s4drive-cli${{ matrix.suffix }}
          retention-days: 14

  # ─── Android build ──────────────────────────────────────────
  # Mobile artifacts are intentionally disabled while desktop releases are
  # being stabilized. Re-enable by setting the repository variable
  # ENABLE_MOBILE_CI=true when Android/iOS work resumes.
  build-android:
    name: Android (APK)
    if: ${{ vars.ENABLE_MOBILE_CI == 'true' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: [lint-test]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^${{ env.TAURI_CLI_VERSION }}"

      - name: Init Android project
        run: |
          cd src-tauri
          cargo tauri android init --ci
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: Build Android APK
        run: |
          cd src-tauri
          cargo tauri android build --ci

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: s4drive-android
          path: src-tauri/gen/android/app/build/outputs/apk/
          retention-days: 14

  # ─── iOS build ──────────────────────────────────────────────
  # Mobile artifacts are intentionally disabled while desktop releases are
  # being stabilized. Re-enable by setting the repository variable
  # ENABLE_MOBILE_CI=true when Android/iOS work resumes.
  build-ios:
    name: iOS (IPA)
    if: ${{ vars.ENABLE_MOBILE_CI == 'true' }}
    runs-on: macos-latest
    continue-on-error: true
    needs: [lint-test]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, x86_64-apple-ios

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^${{ env.TAURI_CLI_VERSION }}"

      - name: Init iOS project
        run: |
          cd src-tauri
          cargo tauri ios init --ci

      - name: Build iOS (debug — unsigned)
        run: |
          cd src-tauri
          cargo tauri ios build --ci --debug

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: s4drive-ios
          path: src-tauri/gen/apple/build/
          retention-days: 14

  # ─── GitHub Release ──────────────────────────────────────────
  release:
    name: Create Release
    if: (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && startsWith(inputs.release_tag, 'v'))) && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs:
      - build-linux
      - build-windows
      - build-macos
      - build-cli
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
          fetch-depth: 0

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Generate release notes
        id: notes
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.release_tag }}"
          fi
          case "$TAG" in
            v*) ;;
            *)
              echo "Release tag must start with v: $TAG" >&2
              exit 1
              ;;
          esac
          git rev-parse "$TAG^{commit}" >/dev/null
          VERSION="${TAG#v}"
          {
            echo "tag=$TAG"
            echo "version=$VERSION"
          } >> "$GITHUB_OUTPUT"
          PREV=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || echo "")
          if [ -n "$PREV" ]; then
            LOG=$(git log "$PREV..$TAG" --oneline --no-decorate 2>/dev/null)
          else
            LOG=$(git log "$TAG" --oneline --max-count=30 --no-decorate 2>/dev/null)
          fi
          {
            echo "# S4Drive v${VERSION}"
            echo
            echo "## What's Changed"
          } > release-notes.md
          echo "$LOG" | sed 's/^/ - /' >> release-notes.md

      - name: Organize release assets
        run: |
          mkdir -p release-assets/
          V=${{ steps.notes.outputs.version }}
          # Linux
          find artifacts/s4drive-linux -type f 2>/dev/null | while read f; do
            case "${f##*.}" in
              deb)     cp "$f" "release-assets/S4Drive-${V}-linux-x86_64.deb" ;;
              rpm)     cp "$f" "release-assets/S4Drive-${V}-linux-x86_64.rpm" ;;
              AppImage) cp "$f" "release-assets/S4Drive-${V}-linux-x86_64.AppImage" ;;
            esac
          done
          # Windows
          find artifacts/s4drive-windows -type f -name "*.msi" 2>/dev/null | while read f; do
            cp "$f" "release-assets/S4Drive-${V}-windows-x86_64.msi"
          done
          # macOS
          find artifacts/s4drive-macos -type f -name "*.dmg" 2>/dev/null | while read f; do
            cp "$f" "release-assets/S4Drive-${V}-macos-universal.dmg"
          done
          # CLI
          find artifacts/ -type f \( -name "s4drive-cli" -o -name "s4drive-cli.exe" \) 2>/dev/null | while read f; do
            artifact_dir=$(basename "$(dirname "$f")")
            target_name="${artifact_dir#s4drive-cli-}"
            suffix=""
            case "$(basename "$f")" in
              *.exe) suffix=".exe" ;;
            esac
            cp "$f" "release-assets/S4Drive-${V}-cli-${target_name}${suffix}"
          done
          test "$(find release-assets -type f | wc -l)" -gt 0
          ls -lh release-assets/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.notes.outputs.tag }}
          name: S4Drive v${{ steps.notes.outputs.version }}
          body_path: release-notes.md
          draft: false
          prerelease: ${{ contains(steps.notes.outputs.tag, 'rc') || contains(steps.notes.outputs.tag, 'beta') || contains(steps.notes.outputs.tag, 'alpha') }}
          files: release-assets/*
          fail_on_unmatched_files: true
