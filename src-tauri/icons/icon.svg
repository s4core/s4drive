    <rect x="-48" y="-32" width="96" height="64" rx="8" stroke="white" stroke-width="3" fill="none"/>
    <!-- Inner label -->
    <text x="0" y="8" text-anchor="middle" font-family="Arial,sans-serif" font-weight="bold" font-size="36">S4</text>
    <!-- Sync arrows -->
    <path d="M48,0 Q60,-20 48,-32" stroke="#53d769" stroke-width="3" fill="none" stroke-linecap="round"/>
    <polygon points="48,-2 44,-12 52,-12" fill="#53d769"/>
    <path d="M-48,0 Q-60,20 -48,32" stroke="#53d769" stroke-width="3" fill="none" stroke-linecap="round"/>
