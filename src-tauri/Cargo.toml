[package]
name = "s4drive-tauri"
version = "0.3.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "s4drive"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
s4drive-core = { path = "../src-core" }
tauri = { version = "2.11", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-share = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shellexpand = "3"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v7"] }
blake3 = "1"
url = "2"

[dev-dependencies]
tempfile = "=3.27.0"
tauri = { version = "2.11", features = ["tray-icon", "test"] }

[features]
default = []
notes-e2e = ["s4drive-core/notes-test-hooks"]
# Serves the embedded `dist` instead of devUrl; release bundles get it from the Tauri CLI.
custom-protocol = ["tauri/custom-protocol"]
